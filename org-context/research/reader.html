<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>@@TITLE@@</title>
<style>
:root{color-scheme:light;--ink:#192d2b;--muted:#526662;--teal:#00675e;--line:#cddbd6;--paper:#fdfdfa}*{box-sizing:border-box}html{scroll-padding-top:20px}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.85 "Segoe UI","Microsoft YaHei",sans-serif}header{background:#153d39;color:#fff;padding:44px max(6vw,24px) 40px}header small{color:#b9e6db;font-weight:600;letter-spacing:.1em}h1{font-size:clamp(30px,4vw,56px);line-height:1.22;max-width:990px;margin:14px 0 0;font-weight:650}.layout{max-width:1500px;margin:auto;display:grid;grid-template-columns:235px minmax(0,1fr);gap:48px;padding:30px 5vw 64px}.nav{position:sticky;top:15px;align-self:start;max-height:94vh;overflow:auto;padding:6px 15px 10px 0;border-right:1px solid var(--line)}.nav strong{font-size:14px;color:var(--muted)}nav a{display:block;font-size:14px;line-height:1.4;margin:2px 0;padding:7px 5px;text-decoration:none;color:var(--ink)}a{color:var(--teal);text-underline-offset:3px}a:hover,nav a:focus{background:#def1eb}main{min-width:0}h2,summary{font-size:clamp(24px,2.4vw,36px);line-height:1.35;margin:0 0 19px}h3{margin:1.7em 0 .55em;font-size:22px;line-height:1.45}p{margin:.8em 0}section{margin:0 0 2.3rem;padding:1rem 0 1.8rem;border-bottom:1px solid var(--line)}section:first-child>p:first-of-type{border-left:4px solid var(--teal);padding:1rem 1.1rem;background:#eef6f1}li{margin:.55em 0}code{font-family:Consolas,monospace;font-size:.94em}.scroll{max-width:100%;overflow-x:auto;margin:1em 0}table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.65}th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:10px 11px}th{background:#e4eee9;color:#23473d}td:first-child{font-weight:550}tr:nth-child(even){background:#f4f7f3}td{min-width:100px;overflow-wrap:anywhere}td:last-child{min-width:130px}details{border:1px solid var(--line);border-radius:6px;margin:14px 0;background:#fff}summary{cursor:pointer;font-size:21px;padding:16px 18px;margin:0;color:var(--teal);font-weight:600}.inner{padding:0 18px 18px}.mobile{display:none}button{font:inherit;color:var(--teal);background:white;border:1px solid var(--line);padding:4px 10px;border-radius:4px;cursor:pointer}
@media(max-width:850px){.layout{display:block;padding:12px 16px 40px}.nav{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);padding:5px 0 12px}.nav strong{display:none}.mobile{display:inline-block}nav{display:none}nav.open{display:block}header{padding:28px 18px}.inner{padding:0 8px 12px}section{padding-top:20px}td{min-width:135px}th,td{padding:8px}summary{font-size:19px}}
@media print{header{background:none;color:black;padding:0}header small,.nav{display:none}.layout{display:block;padding:0}.scroll{overflow:visible}body{font-size:11pt}table{font-size:8pt}td,td:last-child{min-width:0}summary{font-size:15pt}}
</style><header><small>企业研发产品研究　·　2026 年 11 月 18 日</small><h1>@@TITLE@@</h1></header><div class="layout"><aside class="nav"><strong>报告目录</strong><button class="mobile" type="button" aria-controls="toc" aria-expanded="false">报告目录</button><nav id="toc">@@LINKS@@</nav></aside><main>@@CONTENT@@</main></div>
<script>
const nav=document.querySelector('nav'),button=document.querySelector('button');button.addEventListener('click',()=>{const open=nav.classList.toggle('open');button.setAttribute('aria-expanded',String(open))});
function reveal(){const el=document.getElementById(location.hash.slice(1));if(el?.tagName==='DETAILS'){el.open=true;el.scrollIntoView()}}
nav.addEventListener('click',event=>{const a=event.target.closest('a');if(!a)return;const el=document.querySelector(a.hash);if(el?.tagName==='DETAILS')el.open=true;nav.classList.remove('open');button.setAttribute('aria-expanded','false')});addEventListener('hashchange',reveal);reveal();
</script></html>
