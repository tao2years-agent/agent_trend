<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}} · 2026.11</title><style>
:root{--paper:#f7f6f0;--ink:#162e32;--muted:#4d625f;--rule:#bbcac4;--deep:#103b3c;--accent:#baef93;color-scheme:light}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:22px}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.84 "Microsoft YaHei UI","PingFang SC",system-ui,sans-serif}a{color:#155b52;text-underline-offset:.24em}a:hover{color:#8b421b}a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #da8b3b;outline-offset:3px}header{background:var(--deep);color:#f4f7e9;padding:32px max(6vw,24px) 40px;border-bottom:6px solid var(--accent)}header>div,main{max-width:1280px;margin:auto}.meta{font:600 12px/1.4 "IBM Plex Mono",Consolas,monospace;letter-spacing:.12em;color:#b3d8c4}.meta span{padding-right:18px}.hero{display:flex;gap:32px;align-items:end;justify-content:space-between}h1{font-size:clamp(32px,4.5vw,66px);font-weight:640;letter-spacing:-.055em;line-height:1.15;margin:29px 0 14px}header p{margin:0;color:#deece0;font-size:clamp(15px,1.8vw,20px)}.stats{white-space:nowrap;text-align:right;border-left:1px solid #5e847d;padding-left:24px;color:#c4dace;font-size:13px}.stats b{color:var(--accent);font:600 29px/1.3 Consolas,monospace}.stats span{margin-left:6px}main{display:grid;grid-template-columns:minmax(145px,205px) minmax(0,1fr);gap:clamp(32px,5vw,80px);padding:32px max(3vw,20px) 70px}aside{align-self:start;position:sticky;top:15px;max-height:94vh;overflow:auto}aside nav{border-left:2px solid var(--rule);padding:3px 0 3px 15px}aside a{display:block;text-decoration:none;margin:7px 0;color:var(--muted);font-size:13px;line-height:1.52}article{min-width:0}h2{font-size:clamp(23px,2.3vw,33px);line-height:1.4;letter-spacing:-.035em;margin:45px 0 17px;border-top:1px solid var(--rule);padding-top:24px}article>h2:first-child{margin-top:0;border:0;padding-top:0}h3{font-size:20px;margin:23px 0 8px}p{margin:.7em 0}strong{font-weight:660}.tablewrap{overflow-x:auto;margin:14px 0 22px}table{width:100%;border-collapse:collapse;font-size:.9em;line-height:1.65}td,th{text-align:left;vertical-align:top;border-bottom:1px solid var(--rule);padding:10px}th{background:#dfe9df;font-weight:650}tbody tr:nth-child(2n){background:#efefe7}article a[href^="#"]:not(.home){font:600 12px/1.6 Consolas,monospace;text-decoration:none;white-space:nowrap;background:#e4ecdf;padding:1px 4px;border-radius:3px}ul{padding-left:1.35em}details{border-bottom:1px solid var(--rule)}summary{cursor:pointer;padding:12px 0}summary small{display:inline-block;min-width:130px;margin-right:8px;color:var(--muted);font:13px Consolas,"Microsoft YaHei UI",sans-serif}summary strong{font-size:15px}details>div{margin:0 0 20px 18px;font-size:14px}details[open] summary strong{color:#156950}.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}.tools input,.tools select{font:inherit;color:inherit;background:white;border:1px solid #a5b8ad;padding:7px 10px;border-radius:3px}.tools input{flex:1;min-width:150px}.tools label{display:flex;align-items:center;gap:6px;font-size:14px}.tools output{font-size:13px;color:var(--muted)}.home{display:inline-block;margin-top:32px}.note{font-size:14px;color:var(--muted)}@media(max-width:760px){header{padding:24px 18px}.hero{display:block}.stats{margin-top:16px;text-align:left;border:0;padding:0}.stats b{font-size:20px}.stats br{display:none}.stats span{margin-right:14px}main{display:block;padding:20px 16px 45px}aside{position:static;max-height:none;margin-bottom:22px}aside nav{display:flex;flex-wrap:wrap;gap:4px 14px}aside a{margin:2px 0}.tablewrap table{min-width:550px}.tools input,.tools label{max-width:100%}summary small{display:block;margin:0 0 2px 18px}summary strong{overflow-wrap:anywhere}.record>div{margin-left:5px}}@media print{header{background:white;color:black;border-bottom:1px solid}header p,.meta,.stats,.stats b{color:#222}main{display:block;padding:0}.tools,aside,.home{display:none}.record:not([open]){display:none}h2,h3{break-after:avoid}tr{break-inside:avoid}.tablewrap{overflow:visible}a{color:inherit}html{scroll-behavior:auto}}</style></head>
<body id="top"><header><div><div class="meta"><span>研发效能研究</span><span>{{KIND}}</span>2026.11.20</div><div class="hero"><div><h1>{{TITLE}}</h1><p>{{INTRO}}</p></div><div class="stats"><b>{{NCASES}}</b><span>产品与项目</span><br><b>{{NPAPERS}}</b><span>学术工作</span></div></div></div></header>
<main><aside><nav aria-label="报告目录">{{NAV}}</nav></aside><article>{{BODY}}<section aria-labelledby="evidence"><h2 id="evidence">证据索引</h2><p class="note">正文中的编号可打开对应证据。案例、论文和工程现场的分析可离线阅读，原始来源链接需联网。</p>
<div class="tools"><input aria-label="搜索证据" id="query" type="search" placeholder="搜索名称、机制、场景或编号"><label>范围<select id="scope"><option value="">全部</option>{{FILTERS}}</select></label><output aria-live="polite" id="count"></output></div><div id="records">{{RECORDS}}</div></section><a class="home" href="#top">返回开头 ↑</a></article></main>
<script>const q=document.querySelector('#query'),scope=document.querySelector('#scope'),records=[...document.querySelectorAll('.record')],count=document.querySelector('#count');function filter(){let n=0;for(const r of records){r.hidden=!!((scope.value&&r.dataset.section!==scope.value)||!r.textContent.toLowerCase().includes(q.value.trim().toLowerCase()));if(!r.hidden)n++}count.textContent=n+' 项'}q.addEventListener('input',filter);scope.addEventListener('change',filter);function reveal(id){const r=document.getElementById(id);if(r&&r.classList.contains('record')){q.value='';scope.value='';filter();r.open=true;r.scrollIntoView({block:'start'})}}document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a)reveal(a.hash.slice(1))});window.addEventListener('hashchange',()=>reveal(location.hash.slice(1)));filter();if(location.hash)reveal(location.hash.slice(1));</script></body></html>
