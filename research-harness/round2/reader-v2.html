<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{TITLE}}</title><style>
:root{color-scheme:light;--ink:#183331;--mid:#48645e;--dark:#103e38;--rule:#cad7cf;--bg:#f7f8f3;--link:#076954}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:16px}body{margin:0;font:16px/1.8 "Microsoft YaHei","DengXian",sans-serif;color:var(--ink);background:var(--bg);overflow-wrap:anywhere}header{background:var(--dark);color:#fff;padding:38px max(5vw,20px) 33px}header>div{max-width:1160px;margin:auto}.label{font-weight:600;letter-spacing:.1em;color:#c6e3c2;font-size:13px}h1{margin:14px 0 8px;font-size:clamp(28px,4vw,49px);line-height:1.25;letter-spacing:-.04em}header p{margin:0;color:#e1ede5;font-size:17px}main{display:grid;grid-template-columns:218px minmax(0,1fr);gap:46px;max-width:1270px;margin:auto;padding:38px max(4vw,18px) 72px}nav{position:sticky;top:16px;max-height:92vh;overflow:auto;border-left:2px solid var(--rule);padding:0 12px;height:fit-content;font-size:13px}nav a{display:block;color:var(--mid);line-height:1.55;text-decoration:none;padding:4px 1px}nav a:hover,nav a:focus{text-decoration:underline}article{min-width:0}.chapter{margin:0 0 52px;border-top:1px solid var(--rule);padding-top:14px}.chapter:first-child{border-top:0;padding-top:0}h2{font-size:clamp(23px,3vw,32px);line-height:1.4;letter-spacing:-.035em;margin:0 0 15px}h3{font-size:19px;line-height:1.5;margin:24px 0 9px}.chapter h2:not(:first-of-type){font-size:23px;margin-top:26px}.kicker{display:block;color:var(--link);font-size:12px;font-weight:700;letter-spacing:.12em}.kicker:empty{display:none}p{margin:0 0 15px}a{color:var(--link);text-underline-offset:3px}a[data-attachment]:after{content:" ↓";font-size:.75em}.tablewrap{overflow-x:auto;margin:12px 0 20px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--rule);vertical-align:top;text-align:left;padding:10px;min-width:108px}th{background:#e1ece2}dl{display:grid;grid-template-columns:105px 1fr;gap:6px 12px;margin:10px 0}dt{font-weight:bold;color:var(--mid)}dd{margin:0}code{font-size:.91em}pre{overflow-x:auto}label,output{font-size:13px;color:var(--mid);display:block}input{width:100%;font:inherit;padding:6px 10px;background:white;border:1px solid #88a598}details{border-bottom:1px solid var(--rule);padding:9px 0}summary{cursor:pointer;font-weight:bold}footer{max-width:1160px;margin:0 auto 22px;padding:0 20px;color:var(--mid);font-size:13px}.brief main{max-width:1080px}.brief article{max-width:740px}.brief .chapter p:last-child{border-left:3px solid #4c8c71;padding-left:14px}.brief footer{max-width:1010px}ul,ol{padding-left:1.5em}@media(max-width:760px){main{display:block;padding:22px 16px 35px}nav{position:static;max-height:175px;margin-bottom:25px;display:flex;flex-wrap:wrap;gap:2px 12px}header{padding:26px 16px}header p{font-size:15px}.chapter{margin-bottom:32px}td,th{min-width:155px}dl{grid-template-columns:84px 1fr}}
@page{size:A4;margin:17mm 18mm 16mm}@media print{html{scroll-behavior:auto}body{background:white;font-family:"Microsoft YaHei",sans-serif;line-height:1.65;font-size:11pt;color:#17322e}main,.brief main{display:block;max-width:none;padding:0}header,nav,footer{display:none}.brief article{max-width:none}.chapter{break-before:page;margin:0;border-top:0;padding:0}.chapter:first-child{break-before:auto}.brief{font-size:10.5pt;line-height:1.52}.brief .chapter:before{display:block;content:"从 Code Agent 到组织级研发自动化　　·　　2026.11.20　　·　　" attr(data-page);color:#31725f;font-size:8.8pt;font-weight:bold;letter-spacing:.07em;padding-bottom:3mm;border-bottom:1pt solid #77a78e;margin-bottom:5mm}.brief .chapter h2{font-size:22pt;line-height:1.25;margin-bottom:4mm}.brief .chapter p{margin-bottom:3mm}.brief .chapter p:last-child{background:#edf4ee;padding:3mm;border-left:3px solid #558e71}.brief .tablewrap{margin:2.5mm 0 3.5mm;overflow:visible}.brief table{font-size:9pt;line-height:1.35}.brief td,.brief th{padding:1.7mm 2mm;min-width:0}.brief ul{margin:2mm 0;padding-left:5mm}.brief li{margin-bottom:1.2mm}a{color:#267159;text-decoration:none}p{orphans:2;widows:2}}
</style></head><body class="{{MODE}}"><header><div><div class="label">研发效能研究　/　{{KIND}}　　2026.11.20</div><h1>{{TITLE}}</h1><p>{{LEAD}}</p></div></header><main><nav aria-label="章节目录">{{NAV}}</nav><article>{{SECTIONS}}</article></main><footer>研究范围、比较口径及已验证的环境见正文。原始网页链接需联网。</footer>
<script>const files={{ATTACHMENTS}};document.addEventListener('click',e=>{const a=e.target.closest('a[data-attachment]');if(!a)return;e.preventDefault();const f=files[a.dataset.attachment],arr=Uint8Array.from(atob(f.b),c=>c.charCodeAt(0)),url=URL.createObjectURL(new Blob([arr]));const d=document.createElement('a');d.href=url;d.download=f.n;d.click();setTimeout(()=>URL.revokeObjectURL(url),3000)});const search=document.getElementById('search');if(search){const list=[...document.querySelectorAll('.record')];const filter=()=>{let n=0;for(const d of list){d.hidden=!d.textContent.toLowerCase().includes(search.value.trim().toLowerCase());if(!d.hidden)n++}document.getElementById('matches').textContent=n+' 项'};search.addEventListener('input',filter);filter()}</script></body></html>
