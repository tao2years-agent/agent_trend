name: validate-research-navigation

on:
  push:
  pull_request:

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check entry points and local navigation
        run: python -X utf8 scripts/check_repository.py

